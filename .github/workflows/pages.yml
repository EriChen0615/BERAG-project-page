name: Publish project page

on:
  push:
    branches: [master]
    paths:
      - index.html
      - static/**
      - .nojekyll
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Prepare static files
        run: |
          mkdir -p _site/static/{css,js,images,pdfs}
          cp index.html .nojekyll _site/
          cp static/css/index.css _site/static/css/
          cp static/js/index.js _site/static/js/
          cp static/images/berag-icon.svg static/images/berag-overview.webp static/images/berag-overview-large.webp _site/static/images/
          cp static/pdfs/berag-system-diagram.pdf _site/static/pdfs/
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
